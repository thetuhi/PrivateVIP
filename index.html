<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- initial-scale=1 with no maximum-scale: pinch zoom stays available. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0F0E0C" />

 <title>Private VIP Istanbul. Private Tours, Yacht Charters &amp; VIP Transfers</title>
    <meta
      name="description"
      content="A private guide, a private car and a city that answers to your schedule. Bespoke Istanbul itineraries, Bosphorus yacht charters and VIP airport transfers."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="canonical" href="https://privatevipistanbul.com/" />

    <!-- Social share defaults. Per-route values are set at runtime by useSeo(). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Private VIP Istanbul" />
    <meta property="og:title" content="Private VIP Istanbul" />
    <meta
      property="og:description"
      content="Bespoke Istanbul itineraries, Bosphorus yacht charters and VIP airport transfers."
    />
    <meta property="og:image" content="/images/brand/og-cover.webp" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts are self-hosted (see scripts/fetch-fonts.mjs). No third-party
         origin sits in front of first paint, and no visitor IP is handed to a
 font CDN, which is what the privacy policy promises.

         Only the two faces the hero actually paints with are preloaded: the
         display weight for the headline and the body weight for the lede.
         Preloading all 40 subsets would saturate the connection and delay the
         very text this is meant to speed up. The rest arrive on demand via
         each face's unicode-range. -->
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-400-normal-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="preload" href="/fonts/inter-300-normal-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Decides whether the curtain below is shown at all, and must run before
         the body paints, hence inline and blocking.

         The intro is once per session. That check used to live only in React,
         which was fine while the curtain was also created by React: it simply
         never rendered. Now that the curtain is in the static HTML it would be
         painted on every page load and then yanked once the bundle arrived,
         which is a flash on exactly the navigations that should be instant.

         ⚠ 'pvi-intro-seen' must match INTRO_SEEN_KEY in src/motion/
         MotionProvider.jsx. Two places, one string, no import possible. -->
    <script>
      try {
        if (sessionStorage.getItem('pvi-intro-seen') === '1') {
          document.documentElement.classList.add('intro-seen')
        }
      } catch (e) {
        /* Private mode: show it. Better a second curtain than none. */
      }
    </script>

    <style>
      /* Painted before the CSS bundle arrives so the first frame is already
 Nocturne, no white flash on a slow connection. */
      html {
        background-color: #0b0a09;
        color-scheme: dark;
      }
      #root {
        min-height: 100dvh;
      }

      /* ---- Intro curtain --------------------------------------------------
         Deliberately here, in the document, and not in the React tree.

         The point of an entrance is to be the first thing seen. Built in React
         it could not be: on a cold load the bundle has to arrive and parse
         before the first frame of it exists, which on a mid-range phone is a
         second or more of blank page *followed* by a 1.5s curtain. The visitor
         waited twice and only the second wait had anything in it.

         In the document, the curtain paints with the first frame and the
         entrance plays while the bundle is still downloading. The wait is
         covered rather than extended, and the total is shorter even though the
         curtain is now on screen for longer, which is the whole trick.

         The entrance is pure CSS for the same reason: it cannot depend on the
         JavaScript it is meant to be covering. React only ever plays the exit,
         see src/components/motion/LoadingScreen.jsx.

         Values mirror the house vocabulary: ink-950 #0B0A09, brass-500
         #C0A062, bone-muted #8E877C, and the luxe/veil curves. */
      #intro {
        position: fixed;
        inset: 0;
        z-index: 10000;
        /* Never captures input. A tap meant to skip the intro has to reach the
           window listener, and it must not be swallowed by a panel. */
        pointer-events: none;
        /* Failsafe. If the bundle never arrives, 404s, or throws before
           LoadingScreen mounts, the curtain still lifts and the page underneath
           is readable. A permanent veil over working content is the one
           outcome here that is worse than having no entrance at all. */
        animation: intro-failsafe 1ms linear 6s forwards;
      }

      @keyframes intro-failsafe {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      #intro-top,
      #intro-bottom {
        position: absolute;
        left: 0;
        right: 0;
        /* 50.5, not 50: a fractional viewport height rounds to a half-pixel gap
           between the two panels on some displays, and a hairline of hero
           showing through the middle of a closed curtain reads as a bug. */
        height: 50.5%;
        background-color: #0b0a09;
        transition: transform 560ms cubic-bezier(0.76, 0, 0.24, 1) 80ms;
      }

      #intro-top {
        top: 0;
      }

      #intro-bottom {
        bottom: 0;
      }

      #intro-content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 0 1.25rem;
        transition:
          opacity 220ms cubic-bezier(0.16, 1, 0.3, 1),
          transform 220ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* width/height attributes are on the element so the box is reserved
         before the file lands; the logo is 560x219, so 72px tall is 184 wide. */
      #intro-logo {
        display: block;
        height: 72px;
        width: auto;
        max-width: 70vw;
        animation: intro-mark 620ms cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      #intro-rule {
        margin-top: 1.75rem;
        height: 1px;
        width: 7rem;
        background-color: #c0a062;
        transform-origin: left center;
        animation: intro-rule 380ms cubic-bezier(0.76, 0, 0.24, 1) 450ms both;
      }

      #intro-sub {
        margin: 1.25rem 0 0;
        font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 0.75rem;
        line-height: 1.2;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #8e877c;
        animation: intro-sub 240ms linear 580ms both;
      }

      @keyframes intro-mark {
        from {
          opacity: 0;
          transform: translate3d(0, 14px, 0);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes intro-rule {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }

      @keyframes intro-sub {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* The exit. LoadingScreen adds this class, and the panels part vertically:
         a material splitting, rather than a fade, which would say "spinner".
         The content leaves first (no delay) and the panels follow 80ms later,
         via the transition-delay declared on them above. */
      #intro.is-leaving #intro-content {
        opacity: 0;
        transform: translate3d(0, -12px, 0);
      }

      #intro.is-leaving #intro-top {
        transform: translateY(-100%);
      }

      #intro.is-leaving #intro-bottom {
        transform: translateY(100%);
      }

      /* Already seen this session, see the script above. Nothing is painted, so
         a second page load goes straight to the content. */
      .intro-seen #intro {
        display: none;
      }

      /* Reduced motion gets no curtain at all. An entrance is decoration, and
         this is precisely the decoration the setting is asking us to drop. */
      @media (prefers-reduced-motion: reduce) {
        #intro {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- aria-hidden: decorative furniture in front of content that is already in
         the DOM behind it. Announcing it would interrupt the page for no gain. -->
    <div id="intro" aria-hidden="true">
      <div id="intro-top"></div>
      <div id="intro-bottom"></div>

      <div id="intro-content">
        <img id="intro-logo" src="/images/brand/logo.webp" width="184" height="72" alt="" />
        <div id="intro-rule"></div>
        <p id="intro-sub">Istanbul</p>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
